<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente Cromado / Prata Líquida -->
    <linearGradient id="chromeV" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="48%" stop-color="#94A3B8" />
      <stop offset="52%" stop-color="#CBD5E1" />
      <stop offset="75%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Bisel e sombra sutil da asa direita -->
    <linearGradient id="chromeBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#CBD5E1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow sutil esmeralda automotivo no fundo -->
    <radialGradient id="emeraldBackdrop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#247653" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#142D26" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0F1E1A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fundo escuro sutil com cantos arredondados -->
  <rect width="100" height="100" rx="22" fill="#0E1915" />
  <rect width="100" height="100" rx="22" fill="url(#emeraldBackdrop)" />
  <rect width="100" height="100" rx="22" fill="none" stroke="#247653" stroke-width="1.2" stroke-opacity="0.3" />

  <!-- Sombra elegante projetada do V -->
  <path d="M 23 27 L 50 78 L 77 27 L 66 27 L 50 60 L 34 27 Z" fill="#000000" opacity="0.45" transform="translate(0, 2)" />

  <!-- Geometria Minimalista do 'V' Monolítico com corte aerodinâmico -->
  <!-- Asa Esquerda (Placa de reflexo direto) -->
  <path d="M 23 27 L 50 78 L 50 59 L 33 27 Z" fill="url(#chromeV)" />

  <!-- Asa Direita (Face chanfrada de contraste escovado) -->
  <path d="M 50 78 L 77 27 L 67 27 L 50 59 Z" fill="url(#chromeBevel)" />

  <!-- Ponto focal central de luz especular (brilho de diamante) -->
  <line x1="50" y1="59" x2="50" y2="78" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.8" />
</svg>

