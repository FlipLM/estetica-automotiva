<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgVistGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#0B1915"/>
      <stop offset="50%" stop-color="#142D26"/>
      <stop offset="100%" stop-color="#174633"/>
    </linearGradient>
    <radialGradient id="radarVist" cx="52%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#247653" stop-opacity="0.42"/>
      <stop offset="65%" stop-color="#142D26" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0B1915" stop-opacity="0"/>
    </radialGradient>
    <pattern id="techDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#7AB894" fill-opacity="0.24"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bgVistGrad)"/>
  <rect width="800" height="500" fill="url(#techDots)"/>
  <rect width="800" height="500" fill="url(#radarVist)"/>
  <!-- Anéis orbitais 360 graus -->
  <ellipse cx="420" cy="250" rx="295" ry="155" fill="none" stroke="#7AB894" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="10 8"/>
  <ellipse cx="420" cy="250" rx="220" ry="110" fill="none" stroke="#A8D1B8" stroke-opacity="0.3" stroke-width="1.5"/>
  <ellipse cx="420" cy="250" rx="140" ry="68" fill="none" stroke="#318B63" stroke-opacity="0.45" stroke-width="1.5"/>
  <!-- Linhas de escaneamento e vetores angulares -->
  <path d="M125 250 L715 250" stroke="#7AB894" stroke-opacity="0.18" stroke-width="1"/>
  <path d="M420 55 L420 445" stroke="#7AB894" stroke-opacity="0.18" stroke-width="1"/>
  <!-- Pontos de telemetria -->
  <circle cx="285" cy="182" r="7" fill="#D97706" fill-opacity="0.9"/>
  <circle cx="285" cy="182" r="16" fill="#D97706" fill-opacity="0.2"/>
  <circle cx="545" cy="212" r="7" fill="#318B63" fill-opacity="0.95"/>
  <circle cx="545" cy="212" r="16" fill="#A8D1B8" fill-opacity="0.25"/>
  <circle cx="478" cy="332" r="6" fill="#2563EB" fill-opacity="0.9"/>
  <circle cx="478" cy="332" r="14" fill="#2563EB" fill-opacity="0.2"/>
</svg>
